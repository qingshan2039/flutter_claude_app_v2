# M15/T15.5 dev flavor 应用图标配置。
# 放入 dev 专属图标后生成：
#   dart run flutter_launcher_icons -f flutter_launcher_icons-dev.yaml
# 需准备：assets/flavorizr/dev/icon.png（1024×1024 无透明边距）。
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/flavorizr/dev/icon.png"
  min_sdk_android: 24
  remove_alpha_ios: true
  # Android 自适应图标（可选）：
  # adaptive_icon_background: "#1A1A2E"
  # adaptive_icon_foreground: "assets/flavorizr/dev/foreground.png"
